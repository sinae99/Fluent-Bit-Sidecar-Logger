# Mount this file via ConfigMap at /fluent-bit/etc/fluent-bit.conf
# ${NAMESPACE} and ${HOSTNAME} come from the pod environment.

[SERVICE]
    # How often Fluent Bit flushes buffered records to Elasticsearch (seconds)
    Flush           5

    # Sidecar mode — do NOT run as a background daemon
    Daemon          Off

    Log_Level       info

    # Built-in parsers shipped with the official Fluent Bit image (includes CRI parser)
    Parsers_File    /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               app

    # ── IMPORTANT: scope this glob to YOUR app only ──
    

    Path              /var/log/containers/*_<NAMESPACE>_<APP-CONTAINER-NAME>-*.log



    # Parse the CRI log format (timestamp, stream, log tag prefix)
    Parser            cri

    Refresh_Interval  5


    Mem_Buf_Limit     50MB

    # Drop lines longer than the buffer instead of blocking
    Skip_Long_Lines   On

    # Persist tail offset across sidecar restarts
    DB                /tmp/flb_app.db

    # Start reading from the beginning of the file when first seen
    Read_from_Head    On

    # At startup, ignore log lines older than 5 minutes.
    # Remove or increase if you need to backfill after adding the sidecar.
    Ignore_Older      5m

[FILTER]
    Name   modify
    Match  app

    # Enrich every record with Kubernetes context for filtering in Kibana
    Add    pod_name  ${HOSTNAME}
    Add    namespace ${NAMESPACE}

[OUTPUT]
    Name                es
    Match               app

    # Credentials and endpoint — injected from Secret via env vars
    Host                ${ES_HOST}
    Port                ${ES_PORT}
    HTTP_User           ${ES_USER}
    HTTP_Passwd         ${ES_PASSWORD}

    # Creates daily indices: <ES_INDEX_PREFIX>-YYYY.MM.DD
    Logstash_Format     On
    Logstash_Prefix     ${ES_INDEX_PREFIX}

    Time_Key            @timestamp

    # Elasticsearch 7.x+ removed document types — must be On
    Suppress_Type_Name  On

    Retry_Limit         5

    # "On" for HTTPS (ES_PORT 443), "Off" for plain HTTP
    tls                 ${ES_TLS}

    # Log ES output errors to sidecar stdout (visible via kubectl logs)
    Trace_Error         On
