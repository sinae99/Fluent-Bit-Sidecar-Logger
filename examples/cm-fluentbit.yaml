apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  # namespace: default   # set via kubectl -n or kustomization.yaml
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           5
        Daemon          Off
        Log_Level       info
        Parsers_File    /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Tag               app
        # Kubernetes log file pattern: <pod>_<namespace>_<container-name>-<id>.log
        # Adjust namespace and container name below.
        Path              /var/log/containers/*_default_sample-app-*.log
        Parser            cri
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        DB                /tmp/flb_app.db
        Read_from_Head    On
        Ignore_Older      5m

    [FILTER]
        Name   modify
        Match  app
        Add    pod_name  ${HOSTNAME}
        Add    namespace ${NAMESPACE}

    [OUTPUT]
        Name                es
        Match               app
        Host                ${ES_HOST}
        Port                ${ES_PORT}
        HTTP_User           ${ES_USER}
        HTTP_Passwd         ${ES_PASSWORD}
        Logstash_Format     On
        Logstash_Prefix     ${ES_INDEX_PREFIX}
        Time_Key            @timestamp
        Suppress_Type_Name  On
        Retry_Limit         5
        tls                 ${ES_TLS}
        Trace_Error         On
